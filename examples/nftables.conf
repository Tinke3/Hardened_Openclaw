#!/usr/sbin/nft -f
# Host firewall for the agent Pi.
# Replace 198.51.100.0/24 with your management subnet.
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        # DHCP replies
        udp sport 67 udp dport 68 accept

        # IPv6 neighbour discovery, so link-local keeps working
        icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept

        # Administration from the management subnet only
        ip saddr 198.51.100.0/24 tcp dport 22 accept
        ip saddr 198.51.100.0/24 icmp type echo-request accept

        counter comment "dropped packets"
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
